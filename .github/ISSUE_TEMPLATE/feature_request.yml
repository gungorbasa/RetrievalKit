name: Feature request
description: Propose a scoped VectorKit product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Developer problem
      description: Describe the workflow or outcome, not only the proposed API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Correctness, privacy, or platform constraints
  - type: checkboxes
    id: scope
    attributes:
      label: V1 scope
      options:
        - label: This request preserves local-first operation and does not require server, sync, distributed database, or ANN behavior.
          required: true
