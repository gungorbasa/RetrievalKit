name: Bootstrap PyPI project ownership

on:
  workflow_dispatch:
    inputs:
      confirm_bootstrap:
        description: Publish non-SDK 0.0.0a0 placeholders for both PyPI projects
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: bootstrap-pypi-project-ownership
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Publish ownership placeholders through pending OIDC publishers
    if: >-
      inputs.confirm_bootstrap
      && github.ref == 'refs/heads/main'
      && github.actor == 'gungorbasa'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the reviewed bootstrap definition
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Require both project names to remain unused
        run: |
          for project in retrievalkit retrievalkit-graph; do
            status="$(
              curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                "https://pypi.org/pypi/${project}/json"
            )"
            test "$status" = "404"
          done

      - name: Build explicit non-SDK placeholder sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("target/pypi-bootstrap-src")
          projects = {
              "retrievalkit": "retrievalkit_bootstrap_placeholder",
              "retrievalkit-graph": "retrievalkit_graph_bootstrap_placeholder",
          }
          for project, module in projects.items():
              directory = root / project
              directory.mkdir(parents=True, exist_ok=True)
              (directory / "pyproject.toml").write_text(
                  f"""\
          [build-system]
          requires = ["setuptools==80.9.0"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "{project}"
          version = "0.0.0a0"
          description = "Ownership bootstrap placeholder; not a RetrievalKit SDK release"
          readme = "README.md"
          requires-python = ">=3.10"
          license = "Apache-2.0"
          license-files = ["LICENSE", "NOTICE"]
          authors = [
            {{ name = "EGGYOLK YAZILIM TİCARET LİMİTED ŞİRKETİ" }}
          ]
          classifiers = [
            "Development Status :: 1 - Planning",
            "Programming Language :: Python :: 3",
          ]

          [project.urls]
          Repository = "https://github.com/gungorbasa/RetrievalKit"

          [tool.setuptools]
          py-modules = ["{module}"]
          """,
                  encoding="utf-8",
              )
              (directory / "README.md").write_text(
                  f"""\
          # {project} ownership placeholder

          This `0.0.0a0` package only establishes the approved PyPI project
          identity. It contains no RetrievalKit SDK and must not be installed.

          The first SDK release remains gated and will use version `0.1.0`.
          """,
                  encoding="utf-8",
              )
              (directory / f"{module}.py").write_text(
                  '"""Ownership bootstrap placeholder; no SDK code."""\n',
                  encoding="utf-8",
              )
              (directory / "LICENSE").write_bytes(Path("LICENSE").read_bytes())
              (directory / "NOTICE").write_bytes(Path("NOTICE").read_bytes())
          PY

      - name: Build and inspect both placeholder projects
        run: |
          python3 -m pip install --disable-pip-version-check build==1.3.0
          mkdir -p target/pypi-bootstrap
          python3 -m build \
            --outdir "$GITHUB_WORKSPACE/target/pypi-bootstrap" \
            target/pypi-bootstrap-src/retrievalkit
          python3 -m build \
            --outdir "$GITHUB_WORKSPACE/target/pypi-bootstrap" \
            target/pypi-bootstrap-src/retrievalkit-graph
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("target/pypi-bootstrap")
          expected = {
              "retrievalkit-0.0.0a0-py3-none-any.whl": "Name: retrievalkit\n",
              "retrievalkit-0.0.0a0.tar.gz": None,
              "retrievalkit_graph-0.0.0a0-py3-none-any.whl":
                  "Name: retrievalkit-graph\n",
              "retrievalkit_graph-0.0.0a0.tar.gz": None,
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != set(expected):
              raise SystemExit(
                  f"unexpected PyPI bootstrap artifacts: {sorted(actual)}"
              )
          for filename, expected_name in expected.items():
              if expected_name is None:
                  continue
              with ZipFile(root / filename) as wheel:
                  metadata_name = next(
                      name
                      for name in wheel.namelist()
                      if name.endswith(".dist-info/METADATA")
                  )
                  metadata = wheel.read(metadata_name).decode("utf-8")
              if expected_name not in metadata:
                  raise SystemExit(f"incorrect project metadata in {filename}")
              if "Version: 0.0.0a0\n" not in metadata:
                  raise SystemExit(f"incorrect placeholder version in {filename}")
          PY

      - name: Publish through the two pending PyPI publishers
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          packages-dir: target/pypi-bootstrap
