name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-quality:
    name: Rust and retrieval quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy,rustfmt

      - name: Install Python for PyO3 workspace tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-features --no-fail-fast

      - name: Run V2 retrieval-quality gates
        run: |
          cargo run --release -q -p retrievalkit-cli -- \
            bench quality \
            --fixture benchmarks/retrieval-quality/v2/fixture.json \
            --iterations 5

      - name: Run Phase 7 graph-quality smoke gate
        run: cargo test --locked -p retrievalkit-graph --test regression_gates

      - name: Run Phase 7 deterministic registry gates
        run: scripts/benchmarks/run-phase7-pr.sh

      - name: Validate README claims and release metadata
        run: |
          python3 benchmarks/publication/validate_readme.py --repo .
          python3 scripts/release/validate_release.py --repo .
          python3 -m unittest \
            benchmarks.publication.tests.test_readme_claims \
            scripts.release.test_release

  python:
    name: Python wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run base and graph lint, typing, tests, and wheel smoke tests
        env:
          PYTHON_BIN: python
        run: |
          scripts/check-python-wrapper.sh
          scripts/check-python-graph-wrapper.sh

  python-windows-portability:
    name: Python Windows portability (non-release, ${{ matrix.package.name }})
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: base
            directory: wrappers/python
            example: examples/database_quickstart.py
          - name: graph
            directory: wrappers/python-graph
            example: examples/graph_retrieval_quickstart.py
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python wrapper tooling
        run: python -m pip install --disable-pip-version-check "maturin==1.14.1" pytest mypy ruff

      # This source-build lane is portability evidence, not a Windows release
      # or wheel-support claim. It intentionally uploads no artifacts.
      - name: Build and test source portability (non-release)
        working-directory: ${{ matrix.package.directory }}
        run: |
          python -m ruff check .
          python -m mypy
          $wheelDirectory = Join-Path $env:RUNNER_TEMP "retrievalkit-wheel"
          python -m maturin build --locked --release --interpreter python --out $wheelDirectory
          $wheel = Get-ChildItem $wheelDirectory -Filter *.whl | Select-Object -First 1
          if (-not $wheel) {
            throw "maturin completed without producing a Windows portability wheel"
          }
          python -m pip install --disable-pip-version-check --force-reinstall $wheel.FullName
          python -m pytest
          python "${{ matrix.package.example }}"

  node:
    name: Node.js wrapper (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wrappers/typescript/package-lock.json

      - name: Install dependencies
        working-directory: wrappers/typescript
        run: npm ci

      - name: Build and verify base and graph packages
        working-directory: wrappers/typescript
        run: |
          npm run build
          npm run typecheck
          npm run lint
          npm test
          npm run verify:contents
          npm run smoke:install

  kotlin-jvm:
    name: Kotlin/JVM wrapper (macOS arm64, JDK 17)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            wrappers/kotlin/*.gradle.kts
            wrappers/kotlin/gradle/wrapper/gradle-wrapper.properties

      - name: Build JVM native aggregates
        working-directory: wrappers/kotlin
        run: ./scripts/build-native.sh jvm

      - name: Test and inspect JVM artifacts
        working-directory: wrappers/kotlin
        run: |
          ./gradlew :base:test :graph:test :base:inspectBaseArtifact --no-daemon
          ./gradlew :example-retrieval:run :example-graph:run :example-graph:runCombined --no-daemon

  kotlin-android:
    name: Kotlin Android arm64-v8a package
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-linux-android

      - name: Install JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            wrappers/kotlin/*.gradle.kts
            wrappers/kotlin/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android NDK 26
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build Android arm64-v8a native aggregates
        working-directory: wrappers/kotlin
        run: ./scripts/build-native.sh android

      - name: Assemble and inspect Android AARs
        working-directory: wrappers/kotlin
        run: ./gradlew :android-base:inspectBaseAar :android-graph:inspectGraphAar --no-daemon

  apple:
    name: Apple XCFramework and Swift
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust and Apple targets
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Build base and graph aggregate XCFrameworks
        run: |
          scripts/build-xcframework.sh
          scripts/build-xcframework.sh --graph

      - name: Verify Swift base and graph packages
        run: scripts/verify-swift-graph-wrapper.sh --skip-build
      - name: Smoke-test isolated Swift consumers
        run: scripts/release/smoke-swift-consumers.sh
      - name: Test Swift pipeline package
        run: swift test --package-path wrappers/swift/RetrievalKitPipeline
