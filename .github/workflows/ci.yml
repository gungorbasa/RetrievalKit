name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-quality:
    name: Rust and retrieval quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy,rustfmt

      - name: Install Python for PyO3 workspace tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-features --no-fail-fast

      - name: Run V2 retrieval-quality gates
        run: |
          cargo run --release -q -p vectorkit-cli -- \
            bench quality \
            --fixture benchmarks/retrieval-quality/v2/fixture.json \
            --iterations 5

  python:
    name: Python wrapper
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run lint, typing, tests, and installed-wheel smoke test
        env:
          PYTHON_BIN: python
        run: scripts/check-python-wrapper.sh

  apple:
    name: Apple XCFramework and Swift
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust and Apple targets
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Build base and graph aggregate XCFrameworks
        run: |
          scripts/build-xcframework.sh
          scripts/build-xcframework.sh --graph

      - name: Run Swift package tests
        run: |
          swift test --package-path wrappers/swift/VectorKit
          swift test --package-path wrappers/swift/VectorKitGraph
          swift run --package-path wrappers/swift/VectorKitGraph VectorKitGraphQuickstart
