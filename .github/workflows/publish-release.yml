name: Publish v0.1.0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Verified signed release tag
        required: true
        type: string
      candidate_run_id:
        description: Successful release-candidate workflow run ID
        required: true
        type: string
      scheduled_run_id:
        description: Provisioned passing Phase 7 scheduled workflow run ID
        required: true
        type: string
      release_gate_run_id:
        description: Provisioned passing Phase 7 release qualification run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-v0.1.0
  cancel-in-progress: false

jobs:
  authorize:
    name: Validate signed identity and publication authority
    runs-on: ubuntu-24.04
    steps:
      - name: Check out signed tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Require exact version and verified signed tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(tr -d '[:space:]' < VERSION)"
          git verify-tag "$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - name: Download candidate and gate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          SCHEDULED_RUN: ${{ inputs.scheduled_run_id }}
          RELEASE_GATE_RUN: ${{ inputs.release_gate_run_id }}
        run: |
          gh run download "$CANDIDATE_RUN" --repo "$REPOSITORY" --name release-candidate-v0.1.0 --dir target/release-bundle-v0.1.0
          gh run download "$SCHEDULED_RUN" --repo "$REPOSITORY" --dir target/downloaded-scheduled
          gh run download "$RELEASE_GATE_RUN" --repo "$REPOSITORY" --dir target/downloaded-release
          mkdir -p target/phase7-scheduled-result target/phase7-release-result
          cp "$(find target/downloaded-scheduled -name result.json -print -quit)" target/phase7-scheduled-result/result.json
          cp "$(find target/downloaded-release -name result.json -print -quit)" target/phase7-release-result/result.json
      - name: Fail closed on every publication prerequisite
        run: |
          python3 benchmarks/publication/validate_readme.py --repo .
          python3 scripts/release/validate_release.py \
            --repo . \
            --bundle target/release-bundle-v0.1.0 \
            --publication
      - name: Preserve authorized bundle for protected jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authorized-release-v0.1.0
          path: target/release-bundle-v0.1.0
          if-no-files-found: error
          retention-days: 180

  github-release:
    name: Attest and publish GitHub/SwiftPM assets
    needs: authorize
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out signed tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Download authorized bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: authorized-release-v0.1.0
          path: target/release-bundle-v0.1.0
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: target/release-bundle-v0.1.0/artifacts/*
      - name: Create immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            target/release-bundle-v0.1.0/artifacts/* \
            target/release-bundle-v0.1.0/LICENSE \
            target/release-bundle-v0.1.0/NOTICE \
            target/release-bundle-v0.1.0/THIRD_PARTY_NOTICES.md \
            target/release-bundle-v0.1.0/checksums.sha256 \
            target/release-bundle-v0.1.0/inventory.json \
            target/release-bundle-v0.1.0/sbom.spdx.json \
            target/release-bundle-v0.1.0/provenance.intoto.json \
            --verify-tag \
            --title "RetrievalKit $RELEASE_TAG preview" \
            --notes-file CHANGELOG.md

  pypi:
    name: Trusted PyPI publication
    needs: authorize
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download authorized bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: authorized-release-v0.1.0
          path: target/release-bundle-v0.1.0
      - name: Stage the closed wheel inventory only
        run: |
          mkdir -p target/pypi
          cp target/release-bundle-v0.1.0/artifacts/*.whl target/pypi/
          test "$(find target/pypi -name '*.whl' | wc -l | tr -d ' ')" = "10"
      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          packages-dir: target/pypi
