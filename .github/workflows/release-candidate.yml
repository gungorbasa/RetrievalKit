name: Manual v0.1.0 Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source and publication blockers
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate source metadata and historical claims
        run: |
          python3 benchmarks/publication/validate_readme.py --repo .
          python3 scripts/release/validate_release.py --repo .
          scripts/benchmarks/run-phase7-pr.sh

  apple:
    name: Apple artifacts (${{ matrix.root }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        root: [a, b]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SOURCE_DATE_EPOCH: "0"
    steps:
      - name: Check out clean root
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust and Apple targets
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build canonical Apple archives
        run: scripts/release/build-apple-artifacts.sh
      - name: Smoke-test isolated Swift consumers
        run: scripts/release/smoke-swift-consumers.sh
      - name: Upload Apple candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: root-${{ matrix.root }}-apple
          path: target/release-apple-artifacts/*.zip
          if-no-files-found: error
          retention-days: 180

  python:
    name: Python ${{ matrix.python }} (${{ matrix.root }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        root: [a, b]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - name: Check out clean root
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64
      - name: Build and smoke-test all Python distributions
        env:
          PYTHON_BIN: python
          OUTPUT_DIR: target/release-python-wheels
        run: |
          python3 scripts/release/prepare_onnx_runtime.py macos \
            --output target/release-onnxruntime
          export RETRIEVALKIT_ONNX_RUNTIME_LIBRARY="$PWD/target/release-onnxruntime/libonnxruntime.1.24.3.dylib"
          scripts/release/build-python-distribution.sh retrievalkit
          scripts/release/build-python-distribution.sh retrievalkit-graph
          scripts/release/build-python-distribution.sh retrievalkit-embedding
          base_wheel="$(find target/release-python-wheels -name 'retrievalkit-*.whl' ! -name 'retrievalkit_graph-*' -print -quit)"
          graph_wheel="$(find target/release-python-wheels -name 'retrievalkit_graph-*.whl' -print -quit)"
          scripts/release/test-python-coinstallation.sh python "$base_wheel" "$graph_wheel"
      - name: Upload Python candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: root-${{ matrix.root }}-python-${{ matrix.python }}
          path: target/release-python-wheels/*.whl
          if-no-files-found: error
          retention-days: 180

  node:
    name: Node packages (${{ matrix.root }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        root: [a, b]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - name: Check out clean root
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wrappers/typescript/package-lock.json
      - name: Assemble closed npm tarballs
        run: |
          python3 scripts/release/prepare_onnx_runtime.py macos \
            --output target/release-onnxruntime
          export RETRIEVALKIT_ONNX_RUNTIME_LIBRARY="$PWD/target/release-onnxruntime/libonnxruntime.1.24.3.dylib"
          export RETRIEVALKIT_BUNDLE_ONNX_RUNTIME=1
          export RETRIEVALKIT_REQUIRE_BUNDLED_ONNX_RUNTIME=1
          cd wrappers/typescript
          npm ci
          cd ../..
          python3 scripts/release/assemble_node_packages.py \
            --base-name @gungorbasa/retrievalkit \
            --graph-name @gungorbasa/retrievalkit-graph \
            --embedding-name @gungorbasa/retrievalkit-embedding \
            --names-approved \
            --version 0.1.0 \
            --output target/release-stage/node
      - name: Upload Node candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: root-${{ matrix.root }}-node
          path: target/release-stage
          if-no-files-found: error
          retention-days: 180

  browser-embedding:
    name: Browser embedding package (${{ matrix.root }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        root: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - name: Check out clean root
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wrappers/browser-embedding/package-lock.json
      - name: Assemble closed browser embedding tarball
        run: |
          cd wrappers/browser-embedding
          npm ci
          cd ../..
          python3 scripts/release/assemble_browser_embedding_package.py \
            --name @gungorbasa/retrievalkit-browser-embedding \
            --name-approved \
            --version 0.1.0 \
            --output target/release-stage/browser-embedding
      - name: Upload browser embedding candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: root-${{ matrix.root }}-browser-embedding
          path: target/release-stage
          if-no-files-found: error
          retention-days: 180

  browser-retrieval:
    name: Browser retrieval package (${{ matrix.root }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        root: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - name: Check out clean root
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wrappers/browser/package-lock.json
      - name: Build, qualify, and assemble closed browser retrieval tarball
        run: |
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          scripts/check-browser-wasm.sh target/release-browser-wasm
          cd wrappers/browser
          npm ci
          cd ../..
          python3 scripts/release/assemble_browser_package.py \
            --name @gungorbasa/retrievalkit-browser \
            --name-approved \
            --version 0.1.0 \
            --generated-root target/release-browser-wasm \
            --output target/release-stage/browser-retrieval
      - name: Upload browser retrieval candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: root-${{ matrix.root }}-browser-retrieval
          path: target/release-stage
          if-no-files-found: error
          retention-days: 180

  kotlin:
    name: Kotlin packages (${{ matrix.root }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        root: [a, b]
    runs-on: macos-15
    timeout-minutes: 120
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - name: Check out clean root
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-linux-android
      - name: Install JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK 26
        run: |
          sdkmanager "platforms;android-34" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - name: Assemble unsigned Maven Central bundle
        run: |
          python3 scripts/release/prepare_onnx_runtime.py macos \
            --output target/release-onnxruntime
          python3 scripts/release/prepare_onnx_runtime.py android-aar \
            --output target/onnxruntime-android-1.24.3.aar
          export RETRIEVALKIT_ONNX_RUNTIME_LIBRARY="$PWD/target/release-onnxruntime/libonnxruntime.1.24.3.dylib"
          export RETRIEVALKIT_ONNX_RUNTIME_LICENSE="$PWD/target/release-onnxruntime/LICENSE"
          export RETRIEVALKIT_ONNX_RUNTIME_NOTICES="$PWD/target/release-onnxruntime/ThirdPartyNotices.txt"
          export RETRIEVALKIT_ONNX_RUNTIME_ANDROID_AAR="$PWD/target/onnxruntime-android-1.24.3.aar"
          python3 scripts/release/assemble_kotlin_packages.py \
            --group io.github.gungorbasa \
            --version 0.1.0 \
            --java-home "$JAVA_HOME" \
            --namespace-verified \
            --output target/release-stage/kotlin
      - name: Upload Kotlin candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: root-${{ matrix.root }}-kotlin
          path: target/release-stage
          if-no-files-found: error
          retention-days: 180

  assemble:
    name: Prove two-root reproducibility and assemble
    needs: [apple, python, node, browser-retrieval, browser-embedding, kotlin]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download root A
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: root-a-*
          path: target/root-a
          merge-multiple: true
      - name: Download root B
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: root-b-*
          path: target/root-b
          merge-multiple: true
      - name: Compare clean-root artifact bytes
        run: python3 scripts/release/compare_artifacts.py target/root-a target/root-b
      - name: Assemble and independently validate closed bundle
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python3 scripts/release/assemble_release.py \
            --repo . \
            --staging target/root-a \
            --output target/release-bundle-v0.1.0 \
            --source-revision "${GITHUB_SHA}"
          python3 scripts/release/validate_release.py \
            --repo . \
            --bundle target/release-bundle-v0.1.0
      - name: Upload validated release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-v0.1.0
          path: target/release-bundle-v0.1.0
          if-no-files-found: error
          retention-days: 180
