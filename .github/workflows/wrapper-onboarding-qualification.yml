name: Wrapper Onboarding Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wrapper-onboarding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-source-tthw:
    name: Measure Python, Node, and Kotlin time to first result
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out clean release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install JDK 17
        uses: actions/setup-java@7a445ee88d4e23b52c33d4a8f60988f9e375f22d # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate fixed onboarding plan
        run: |
          python -m unittest scripts.release.test_measure_wrapper_tthw
          python scripts/release/measure_wrapper_tthw.py \
            --repo . \
            --output target/wrapper-onboarding/plan-unused.json \
            --print-plan

      - name: Measure clean-source onboarding
        run: |
          python scripts/release/measure_wrapper_tthw.py \
            --repo . \
            --python-bin python \
            --output target/wrapper-onboarding/results.json

      - name: Add qualification summary
        if: always()
        run: |
          if [ -f target/wrapper-onboarding/results.json ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("target/wrapper-onboarding/results.json").read_text())
          rows = [
              "| Wrapper | Status | Time to first result |",
              "|---|---|---:|",
          ]
          rows.extend(
              f"| {result['wrapper']} | {result['status']} | {result['duration_seconds']:.3f}s |"
              for result in report["results"]
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "# Wrapper onboarding qualification\n\n"
              + report["measurement"]["cache_policy"]
              + "\n\n"
              + "\n".join(rows)
              + "\n"
          )
          PY
          fi

      - name: Preserve machine-readable onboarding evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: wrapper-onboarding-qualification-${{ github.run_id }}
          path: target/wrapper-onboarding/results.json
          retention-days: 90
