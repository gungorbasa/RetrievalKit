<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="540" viewBox="0 0 1200 540"
     role="img" aria-labelledby="title desc">
  <title id="title">One canonical corpus, three RetrievalKit query paths</title>
  <desc id="desc">App-owned records and relationships enter one canonical corpus. The shared Rust core provides retrieval, graph traversal, and graph-scoped retrieval, returning traceable results inside the application boundary.</desc>

  <rect x="1" y="1" width="1198" height="538" rx="24" fill="#F8FAFC" stroke="#DDE3EA" stroke-width="2"/>

  <text x="48" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" letter-spacing="2" fill="#1769FF">ONE CORPUS · THREE QUERY PATHS</text>
  <text x="48" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="25" font-weight="650" fill="#15181F">Store app-owned data once. Add only the retrieval capabilities you need.</text>

  <g id="application-boundary" transform="translate(48 122)">
    <rect width="1104" height="354" rx="20" fill="#FFFFFF" stroke="#CBD3DC" stroke-width="2"/>
    <text x="24" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#68717D">APPLICATION BOUNDARY</text>

    <g id="corpus" transform="translate(24 62)">
      <rect width="224" height="250" rx="16" fill="#15181F"/>
      <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="26" font-weight="700" fill="#FFFFFF">Canonical</text>
      <text x="24" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="26" font-weight="700" fill="#FFFFFF">corpus</text>
      <text x="24" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#AEB7C3">records · chunks</text>
      <text x="24" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#AEB7C3">metadata · IDs</text>
      <text x="24" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#AEB7C3">relationships</text>
      <path d="M24 182 H200" stroke="#39414C"/>
      <text x="24" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#50A2FF">STORE ONCE</text>
      <text x="24" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" fill="#AEB7C3">derive capabilities</text>
    </g>

    <g id="fanout" stroke="#9AA4B2" stroke-width="2" fill="none">
      <path d="M248 181 H280 V105 H304"/>
      <path d="M280 181 H304"/>
      <path d="M280 181 V257 H304"/>
    </g>
    <g fill="#9AA4B2">
      <path d="M304 99 L314 105 L304 111 Z"/>
      <path d="M304 175 L314 181 L304 187 Z"/>
      <path d="M304 251 L314 257 L304 263 Z"/>
    </g>

    <g id="query-paths" transform="translate(314 62)">
      <g id="retrieval-path">
        <rect width="494" height="70" rx="13" fill="#F4F6F8" stroke="#DDE3EA"/>
        <text x="20" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="18" font-weight="700" fill="#1769FF">01 RETRIEVAL</text>
        <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="21" font-weight="650" fill="#15181F">Exact vector · BM25 · hybrid</text>
      </g>
      <g id="graph-path" transform="translate(0 76)">
        <rect width="494" height="70" rx="13" fill="#F4F6F8" stroke="#DDE3EA"/>
        <text x="20" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="18" font-weight="700" fill="#1769FF">02 GRAPH</text>
        <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="21" font-weight="650" fill="#15181F">Traverse · match · project</text>
      </g>
      <g id="graph-retrieval-path" transform="translate(0 152)">
        <rect width="494" height="86" rx="13" fill="#EEF5FF" stroke="#1769FF" stroke-width="2"/>
        <text x="20" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="18" font-weight="700" fill="#1769FF">03 GRAPH + RETRIEVAL</text>
        <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="21" font-weight="650" fill="#15181F">Scope relationships, then rank</text>
      </g>
    </g>

    <g id="outputs" transform="translate(848 62)">
      <path d="M-40 35 H-10" stroke="#9AA4B2" stroke-width="2"/>
      <path d="M-10 29 L0 35 L-10 41 Z" fill="#9AA4B2"/>
      <text x="16" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#15181F">ranked hits</text>
      <text x="16" y="53" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" fill="#68717D">+ trace</text>

      <path d="M-40 111 H-10" stroke="#9AA4B2" stroke-width="2"/>
      <path d="M-10 105 L0 111 L-10 117 Z" fill="#9AA4B2"/>
      <text x="16" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#15181F">related records</text>
      <text x="16" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" fill="#20A66A">no embeddings</text>

      <path d="M-40 195 H-10" stroke="#1769FF" stroke-width="2"/>
      <path d="M-10 189 L0 195 L-10 201 Z" fill="#1769FF"/>
      <text x="16" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" font-weight="700" fill="#1769FF">scoped hits</text>
      <text x="16" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" fill="#68717D">+ trace</text>
    </g>
  </g>

  <text x="48" y="514" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#68717D">SHARED RUST CORE · LOCAL EXECUTION · DETERMINISTIC ORDERING · TRANSACTIONAL NATIVE SNAPSHOTS</text>
</svg>
