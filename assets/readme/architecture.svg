<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="560" viewBox="0 0 1200 560"
     role="img" aria-labelledby="title desc">
  <title id="title">VectorKit retrieval data flow</title>
  <desc id="desc">Caller-provided text and embeddings enter the canonical corpus. The corpus feeds exact plus BM25 hybrid retrieval and an optional graph capability with graph-scoped ranking; both produce explainable results. The corpus persists through transactional, checksummed crash-safe snapshots. All stages run in-process in the shared Rust core.</desc>

  <rect width="1200" height="560" rx="20" fill="#0A0D12"/>

  <text x="48" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="19" letter-spacing="2" fill="#E8A13D">SYSTEM MAP · EVERY STAGE RUNS IN-PROCESS IN THE SHARED RUST CORE</text>

  <!-- main row -->
  <g id="main-row">
    <g id="box-input">
      <rect x="48" y="120" width="250" height="110" rx="10" fill="#10161E" stroke="#2A3542" stroke-width="1.5"/>
      <text x="72" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="600" fill="#F3F5F7">Text + embeddings</text>
      <text x="72" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9AA6B2">caller-provided or</text>
      <text x="72" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9AA6B2">local Core ML</text>
    </g>

    <g id="box-corpus">
      <rect x="332" y="120" width="250" height="110" rx="10" fill="#10161E" stroke="#2A3542" stroke-width="1.5"/>
      <text x="356" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="600" fill="#F3F5F7">Canonical corpus</text>
      <text x="356" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9AA6B2">records · chunks</text>
      <text x="356" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9AA6B2">typed metadata</text>
    </g>

    <g id="box-retrieval">
      <rect x="616" y="120" width="250" height="110" rx="10" fill="#10161E" stroke="#2A3542" stroke-width="1.5"/>
      <text x="640" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="600" fill="#F3F5F7">Exact + BM25</text>
      <text x="640" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="600" fill="#F3F5F7">hybrid retrieval</text>
      <text x="640" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9AA6B2">semantic · lexical</text>
    </g>

    <g id="box-results">
      <rect x="900" y="120" width="250" height="110" rx="10" fill="#1B1F1A" stroke="#E8A13D" stroke-width="1.5"/>
      <text x="924" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="600" fill="#E8A13D">Explainable results</text>
      <text x="924" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9AA6B2">top-k · scores</text>
      <text x="924" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9AA6B2">search trace</text>
    </g>
  </g>

  <!-- main row arrows -->
  <g stroke="#5B6673" stroke-width="1.5">
    <line x1="298" y1="175" x2="322" y2="175"/>
    <line x1="582" y1="175" x2="606" y2="175"/>
    <line x1="866" y1="175" x2="890" y2="175"/>
  </g>
  <g fill="#5B6673">
    <path d="M322 170 L322 180 L330 175 Z"/>
    <path d="M606 170 L606 180 L614 175 Z"/>
    <path d="M890 170 L890 180 L898 175 Z"/>
  </g>

  <!-- persistence -->
  <g id="box-persistence">
    <rect x="332" y="330" width="250" height="110" rx="10" fill="#10161E" stroke="#2A3542" stroke-width="1.5"/>
    <text x="356" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="22" font-weight="600" fill="#F3F5F7">Crash-safe snapshots</text>
    <text x="356" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9AA6B2">transactional</text>
    <text x="356" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9AA6B2">checksummed</text>
  </g>
  <g stroke="#5B6673" stroke-width="1.5">
    <line x1="457" y1="242" x2="457" y2="318"/>
  </g>
  <g fill="#5B6673">
    <path d="M452 242 L462 242 L457 234 Z"/>
    <path d="M452 318 L462 318 L457 326 Z"/>
  </g>

  <!-- graph branch -->
  <g id="box-graph">
    <rect x="616" y="330" width="250" height="110" rx="10" fill="#10161E" stroke="#2A3542" stroke-width="1.5"/>
    <text x="640" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="22" font-weight="600" fill="#F3F5F7">Graph capability</text>
    <text x="640" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9AA6B2">optional traversal</text>
    <text x="640" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9AA6B2">scoped ranking</text>
  </g>
  <!-- corpus -> graph elbow -->
  <path d="M560 230 L560 280 L741 280 L741 318" fill="none" stroke="#5B6673" stroke-width="1.5"/>
  <path d="M736 318 L746 318 L741 326 Z" fill="#5B6673"/>
  <!-- graph -> results elbow -->
  <path d="M866 385 L1025 385 L1025 244" fill="none" stroke="#5B6673" stroke-width="1.5"/>
  <path d="M1020 244 L1030 244 L1025 236 Z" fill="#5B6673"/>

  <text x="48" y="516" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9AA6B2">Embeddings are the only stage you bring — keep them local (Core ML via EmbeddingKit) for a private flow.</text>
</svg>
