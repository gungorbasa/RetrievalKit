<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="560" viewBox="0 0 1200 560"
     role="img" aria-labelledby="title desc">
  <title id="title">RetrievalKit query paths</title>
  <desc id="desc">One canonical corpus supports three independent paths in the shared Rust core: retrieval-only exact vector, BM25, or hybrid ranking; graph-only traversal and projection without embeddings; and graph-scoped retrieval that selects related candidates before ranking.</desc>

  <rect width="1200" height="560" rx="20" fill="#0A0D12"/>

  <text x="48" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="20" letter-spacing="2" fill="#E8A13D">THREE QUERY PATHS · SHARED RUST CORE</text>
  <text x="48" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="21" fill="#C6CFD8">Choose only the capabilities your application needs.</text>

  <g id="corpus">
    <rect x="48" y="148" width="222" height="286" rx="14" fill="#10161E"
          stroke="#2A3542" stroke-width="1.5"/>
    <text x="72" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="26" font-weight="700" fill="#F3F5F7">One corpus</text>
    <text x="72" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#9AA6B2">records</text>
    <text x="72" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#9AA6B2">chunks</text>
    <text x="72" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#9AA6B2">metadata</text>
    <text x="72" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#9AA6B2">relationships</text>
    <path d="M72 350 H246" stroke="#2A3542" stroke-width="1.5"/>
    <text x="72" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#E8A13D">store once</text>
    <text x="72" y="411" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#9AA6B2">derive capabilities</text>
  </g>

  <g id="retrieval-path">
    <rect x="314" y="148" width="836" height="82" rx="12" fill="#10161E"
          stroke="#2A3542" stroke-width="1.5"/>
    <text x="338" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" font-weight="700" fill="#E8A13D">01 RETRIEVALDATABASE</text>
    <text x="338" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="650" fill="#F3F5F7">Exact vector · BM25 · hybrid</text>
    <path d="M684 189 H850" stroke="#5B6673" stroke-width="2"/>
    <path d="M850 183 L860 189 L850 195 Z" fill="#5B6673"/>
    <text x="892" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#C6CFD8">ranked hits + trace</text>
  </g>

  <g id="graph-path">
    <rect x="314" y="250" width="836" height="82" rx="12" fill="#10161E"
          stroke="#2A3542" stroke-width="1.5"/>
    <text x="338" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" font-weight="700" fill="#E8A13D">02 GRAPHDATABASE</text>
    <text x="338" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="650" fill="#F3F5F7">Traverse · match · project</text>
    <path d="M684 291 H850" stroke="#5B6673" stroke-width="2"/>
    <path d="M850 285 L860 291 L850 297 Z" fill="#5B6673"/>
    <text x="892" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#C6CFD8">related records</text>
    <text x="892" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#75C9AE">no embeddings</text>
  </g>

  <g id="combined-path">
    <rect x="314" y="352" width="836" height="82" rx="12" fill="#1B1F1A"
          stroke="#E8A13D" stroke-width="1.5"/>
    <text x="338" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" font-weight="700" fill="#E8A13D">03 GRAPHRETRIEVALDATABASE</text>
    <text x="338" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="650" fill="#F3F5F7">Graph scope → exact vector · BM25 · hybrid</text>
    <path d="M760 393 H850" stroke="#E8A13D" stroke-width="2"/>
    <path d="M850 387 L860 393 L850 399 Z" fill="#E8A13D"/>
    <text x="892" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#E8A13D">scoped ranked hits</text>
  </g>

  <g id="fanout" stroke="#5B6673" stroke-width="2" fill="#5B6673">
    <path d="M270 291 H292 V189 H302"/>
    <path d="M302 183 L312 189 L302 195 Z"/>
    <path d="M292 291 H302"/>
    <path d="M302 285 L312 291 L302 297 Z"/>
    <path d="M292 291 V393 H302"/>
    <path d="M302 387 L312 393 L302 399 Z"/>
  </g>

  <g id="persistence">
    <rect x="48" y="474" width="1102" height="48" rx="10" fill="#10161E"
          stroke="#2A3542" stroke-width="1.5"/>
    <text x="72" y="505" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" fill="#9AA6B2">LOCAL-FIRST · DETERMINISTIC · TRANSACTIONAL SNAPSHOTS · RUST-OWNED VALIDATION, FILTERING, ORDERING, AND TRACES</text>
  </g>
</svg>
