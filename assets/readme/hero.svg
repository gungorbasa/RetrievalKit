<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">RetrievalKit</title>
  <desc id="desc">Exact vector, BM25, hybrid, standalone graph, and graph-scoped retrieval for Swift, Python, Node.js, Kotlin, Android, and browsers.</desc>

  <rect width="1200" height="400" rx="20" fill="#0A0D12"/>

  <g id="title-block">
    <text x="64" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20" letter-spacing="3" fill="#E8A13D">LOCAL RETRIEVAL · NO SERVER</text>

    <text x="60" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="88" font-weight="800" fill="#F3F5F7">RetrievalKit</text>

    <text x="64" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="26" fill="#C6CFD8">Exact vector · BM25 · hybrid. Graph-only search.</text>
    <text x="64" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="26" fill="#C6CFD8">Or scope retrieval with relationships.</text>

    <g id="product-flow" transform="translate(64 304)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="17">
      <rect x="0" y="0" width="190" height="38" rx="7" fill="#10161E" stroke="#2A3542"/>
      <text x="95" y="25" text-anchor="middle" fill="#F3F5F7">retrieval</text>
      <rect x="206" y="0" width="190" height="38" rx="7" fill="#10161E" stroke="#2A3542"/>
      <text x="301" y="25" text-anchor="middle" fill="#F3F5F7">graph only</text>
      <rect x="412" y="0" width="236" height="38" rx="7" fill="#1B1F1A" stroke="#E8A13D"/>
      <text x="530" y="25" text-anchor="middle" fill="#E8A13D">graph + retrieval</text>
    </g>

    <text x="64" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" letter-spacing="1" fill="#9AA6B2">RUST CORE · SWIFT · PYTHON · NODE.JS · KOTLIN · WASM</text>
  </g>

  <g id="apollo-example">
    <rect x="768" y="40" width="368" height="320" rx="26" fill="#10161E"
          stroke="#2A3542" stroke-width="1.5"/>

    <text x="800" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="2" fill="#E8A13D">CHOOSE A QUERY PATH</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="800" y="110" width="304" height="58" rx="8" fill="#161E28" stroke="#2A3542"/>
      <text x="820" y="134" font-size="13" fill="#E8A13D">01 RETRIEVAL</text>
      <text x="820" y="155" font-size="16" fill="#C6CFD8">vector · BM25 · hybrid</text>

      <rect x="800" y="184" width="304" height="58" rx="8" fill="#161E28" stroke="#2A3542"/>
      <text x="820" y="208" font-size="13" fill="#E8A13D">02 GRAPH</text>
      <text x="820" y="229" font-size="16" fill="#C6CFD8">traverse · project</text>

      <rect x="800" y="258" width="304" height="74" rx="8" fill="#1B1F1A" stroke="#E8A13D"/>
      <text x="820" y="282" font-size="13" fill="#E8A13D">03 GRAPH + RETRIEVAL</text>
      <text x="820" y="304" font-size="16" fill="#F3F5F7">scope relationships</text>
      <text x="820" y="324" font-size="16" fill="#F3F5F7">then rank</text>
    </g>
  </g>
</svg>
