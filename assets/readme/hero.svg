<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">RetrievalKit — private retrieval inside your app</title>
  <desc id="desc">RetrievalKit combines exact vector search, BM25, hybrid ranking, and graph-aware context inside the application boundary.</desc>

  <rect x="1" y="1" width="1198" height="398" rx="24" fill="#F8FAFC" stroke="#DDE3EA" stroke-width="2"/>

  <g id="brand" transform="translate(58 44)">
    <rect width="44" height="44" rx="10" fill="#15181F"/>
    <rect x="10" y="12" width="24" height="4" rx="2" fill="#F9FAFB"/>
    <rect x="8" y="18" width="28" height="9" rx="2.5" fill="#50A2FF"/>
    <rect x="10" y="21" width="24" height="4" rx="2" fill="#15181F"/>
    <rect x="10" y="30" width="16" height="4" rx="2" fill="#F9FAFB"/>
    <text x="58" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#15181F">RetrievalKit</text>
  </g>

  <g id="title-block" transform="translate(58 122)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="2" fill="#1769FF">FAST, PRIVATE RETRIEVAL FOR EDGE AI</text>
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="62" font-weight="760" letter-spacing="-2" fill="#15181F">Search private data</text>
    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="62" font-weight="760" letter-spacing="-2" fill="#15181F">inside your app.</text>
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" fill="#4B5563">Exact vector · BM25 · hybrid · graph-aware context</text>
    <text x="0" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#68717D">SWIFT · PYTHON · TYPESCRIPT · KOTLIN · BROWSER</text>
  </g>

  <g id="local-boundary" transform="translate(762 38)">
    <rect width="382" height="324" rx="22" fill="#FFFFFF" stroke="#CBD3DC" stroke-width="2"/>
    <text x="24" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="1.5" fill="#68717D">YOUR PROCESS</text>
    <text x="358" y="38" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#1769FF">LOCAL EXECUTION</text>

    <g id="flow" transform="translate(24 76)">
      <g id="inputs">
        <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="18" fill="#68717D">INPUTS</text>
        <rect x="0" y="18" width="84" height="38" rx="8" fill="#F1F4F7" stroke="#DDE3EA"/>
        <text x="42" y="43" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" fill="#15181F">Query</text>
        <rect x="0" y="66" width="84" height="58" rx="8" fill="#F1F4F7" stroke="#DDE3EA"/>
        <text x="42" y="90" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" fill="#15181F">App data</text>
        <text x="42" y="111" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="16" fill="#68717D">local</text>
      </g>

      <path d="M96 70 H126" stroke="#9AA4B2" stroke-width="2"/>
      <path d="M126 64 L136 70 L126 76 Z" fill="#9AA4B2"/>

      <g id="engine" transform="translate(138 22)">
        <rect width="88" height="96" rx="18" fill="#15181F"/>
        <rect x="25" y="25" width="38" height="5" rx="2.5" fill="#F9FAFB"/>
        <rect x="20" y="36" width="48" height="16" rx="4" fill="#50A2FF"/>
        <rect x="25" y="41.5" width="38" height="5" rx="2.5" fill="#15181F"/>
        <rect x="25" y="62" width="27" height="5" rx="2.5" fill="#F9FAFB"/>
        <text x="44" y="122" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="16" fill="#15181F">RUST CORE</text>
      </g>

      <path d="M238 70 H268" stroke="#9AA4B2" stroke-width="2"/>
      <path d="M268 64 L278 70 L268 76 Z" fill="#9AA4B2"/>

      <g id="results" transform="translate(280 0)">
        <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="18" fill="#68717D">RESULTS</text>
        <rect x="0" y="18" width="54" height="106" rx="9" fill="#F1F4F7" stroke="#DDE3EA"/>
        <rect x="10" y="31" width="34" height="7" rx="3.5" fill="#1769FF"/>
        <rect x="10" y="49" width="26" height="5" rx="2.5" fill="#9AA4B2"/>
        <rect x="10" y="67" width="34" height="7" rx="3.5" fill="#50A2FF"/>
        <rect x="10" y="85" width="22" height="5" rx="2.5" fill="#9AA4B2"/>
        <rect x="10" y="103" width="34" height="7" rx="3.5" fill="#B8C0CB"/>
      </g>
    </g>

    <path d="M24 244 H358" stroke="#DDE3EA"/>
    <circle cx="34" cy="278" r="6" fill="#20A66A"/>
    <text x="50" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="19" font-weight="650" fill="#15181F">Data stays inside the app boundary</text>
    <text x="24" y="307" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" fill="#68717D">0 network calls after model download</text>
  </g>
</svg>
