[package]
name = "retrievalkit-embedding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional local ONNX text embeddings for RetrievalKit"

[dependencies]
fs2 = "0.4.3"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["api-24", "load-dynamic", "ndarray", "std"] }
sha2 = "0.10.9"
thiserror = "2.0.12"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
ureq = { version = "3.1.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
retrievalkit-core = { path = "../retrievalkit-core" }
retrievalkit-graph = { path = "../retrievalkit-graph" }
serde = "1.0.228"
serde_json = "1.0.145"
tempfile = "3.20.0"
