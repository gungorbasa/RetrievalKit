[package]
name = "retrievalkit-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
graph = ["dep:retrievalkit-graph", "dep:retrievalkit-phase4-bench"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
simsimd = "6.5.16"
retrievalkit-core = { path = "../retrievalkit-core" }
retrievalkit-graph = { path = "../retrievalkit-graph", optional = true }
retrievalkit-phase4-bench = { path = "../retrievalkit-phase4-bench", optional = true }
retrievalkit-ingest = { path = "../retrievalkit-ingest" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2.186"
