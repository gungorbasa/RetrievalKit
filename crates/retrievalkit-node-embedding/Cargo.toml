[package]
name = "retrievalkit-node-embedding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional Node.js ONNX text embeddings for RetrievalKit"
publish = false

[lib]
name = "retrievalkit_node_embedding_native"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.3.0", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "3.2.5"
retrievalkit-embedding = { path = "../retrievalkit-embedding" }
sha2 = "0.10.9"

[build-dependencies]
napi-build = "2.2.4"

[dev-dependencies]
napi = { version = "3.3.0", default-features = false, features = ["napi8", "async", "tokio_rt", "noop"] }
