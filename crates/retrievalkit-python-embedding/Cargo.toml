[package]
name = "retrievalkit-python-embedding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin Python binding for RetrievalKit's optional local embedding provider"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module"] }
retrievalkit-embedding = { path = "../retrievalkit-embedding" }
sha2 = "0.10.9"
