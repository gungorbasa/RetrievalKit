[package]
name = "vectorkit-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vectorkit"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
simsimd = "6.5.16"
vectorkit-core = { path = "../vectorkit-core" }
vectorkit-ffi = { path = "../vectorkit-ffi" }
