[package]
name = "vectorkit-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
graph = ["dep:vectorkit-graph", "dep:vectorkit-phase4-bench"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
simsimd = "6.5.16"
vectorkit-core = { path = "../vectorkit-core" }
vectorkit-graph = { path = "../vectorkit-graph", optional = true }
vectorkit-phase4-bench = { path = "../vectorkit-phase4-bench", optional = true }
vectorkit-ingest = { path = "../vectorkit-ingest" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2.186"
