[package]
name = "vectorkit-python"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = []
graph = ["dep:vectorkit-graph"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
vectorkit-core = { path = "../vectorkit-core" }
vectorkit-graph = { path = "../vectorkit-graph", optional = true }
vectorkit-ingest = { path = "../vectorkit-ingest" }
