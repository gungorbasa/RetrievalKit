[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "retrievalkit-graph"
version = "0.1.0"
description = "Optional aggregate graph package for RetrievalKit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.maturin]
manifest-path = "../../crates/retrievalkit-python/Cargo.toml"
module-name = "retrievalkit_graph._native"
python-source = "python"
features = ["graph"]
exclude = ["python/**/__pycache__/**", "python/**/*.pyc"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["python/retrievalkit_graph", "tests/typing_smoke.py"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
