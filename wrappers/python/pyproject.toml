[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "vectorkit"
version = "0.1.0"
description = "Thin Python wrapper for the VectorKit Rust retrieval core"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "VectorKit" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries"
]

[tool.maturin]
manifest-path = "../../crates/vectorkit-python/Cargo.toml"
module-name = "vectorkit._native"
python-source = "python"
