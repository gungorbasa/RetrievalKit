name: RetrievalKitAppleE2EIOSBench
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  RetrievalKitAppleE2EBench:
    path: ../RetrievalKitAppleE2EBench
targets:
  RetrievalKitAppleE2EIOSBench:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: RetrievalKitAppleE2EBench
        product: RetrievalKitAppleE2EBenchmarkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.retrievalkit.RetrievalKitAppleE2EIOSBench
        PRODUCT_NAME: RetrievalKitAppleE2EIOSBench
        DEVELOPMENT_TEAM: 456T4LX972
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: RetrievalKit E2E Bench
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
